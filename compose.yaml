# compose.yaml
#
# Use 'just start [flavor]' to run, building only if needed.
# Or: docker buildx bake <flavor> && FLAVOR=<flavor> docker compose up -d --no-build

services:
  workspace:
    image: ${REGISTRY:-ghcr.io/jo-cube}/workspace:${FLAVOR:-code}
    ports:
      - "${WORKSPACE_BIND_ADDRESS:-127.0.0.1}:${WORKSPACE_PORT:-8080}:8080"
    volumes:
      - ./workspace:/workspace
      - home:/home/dev
      - cache:/cache
      - ./runtime-config:/etc/workspace:ro
    environment:
      - ENABLE_CADDY=true
      - WORKSPACE_CONFIG_FILE
      - PASSWORD
      - HASHED_PASSWORD
      - JUPYTER_TOKEN
    hostname: workspace

volumes:
  home:
  cache:
