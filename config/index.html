<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Workspace</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0d1117;
      --surface: #161b22;
      --border: #30363d;
      --text: #c9d1d9;
      --muted: #8b949e;
      --accent: #58a6ff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 2rem;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, sans-serif;
    }

    main {
      max-width: 680px;
      margin: 0 auto;
    }

    h1 {
      margin: 0 0 0.25rem;
      color: var(--accent);
      font-size: 1.5rem;
    }

    p {
      margin: 0;
      color: var(--muted);
    }

    .services {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 0.75rem;
      margin: 2rem 0;
    }

    .card {
      display: block;
      padding: 1rem 1.25rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      color: var(--text);
      text-decoration: none;
    }

    .card:hover,
    .card:focus-visible {
      border-color: var(--accent);
      outline: none;
    }

    .card strong {
      display: block;
      margin-bottom: 0.35rem;
    }

    .card span,
    footer {
      color: var(--muted);
      font-size: 0.85rem;
    }

    footer a {
      margin-right: 1rem;
      color: var(--accent);
    }
  </style>
</head>
<body>
  <main>
    <h1>Workspace</h1>
    <p>Development tools in your browser.</p>

    <nav class="services" aria-label="Workspace services">
      <a class="card" href="/code/">
        <strong>Code Server</strong>
        <span>VS Code in your browser</span>
      </a>
      <a class="card" href="/lab">
        <strong>JupyterLab</strong>
        <span>Interactive notebooks · full image</span>
      </a>
    </nav>

    <footer>
      <a href="/health">Health</a>
      <a href="/status">Status</a>
    </footer>
  </main>
</body>
</html>
