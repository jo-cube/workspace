name: Release Images

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

concurrency:
  # Different release versions update the same moving aliases.
  group: release-images
  queue: max
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/workspace

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify tag is on main
        run: |
          set -euo pipefail
          git fetch origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Compute image tags
        id: meta
        run: |
          set -euo pipefail
          ref="${GITHUB_REF_NAME}"
          version="${ref#v}"
          if [ "$version" = "$ref" ]; then
            echo "Tag must start with v: $ref" >&2
            exit 1
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag must look like v1.2.3 or v1.2.3-rc.1: $ref" >&2
            exit 1
          fi

          prerelease=false
          case "$version" in
            *-*) prerelease=true ;;
          esac

          major="${version%%.*}"
          rest="${version#*.}"
          minor="${rest%%.*}"
          minor_version="${major}.${minor}"

          {
            echo "version=$version"
            echo "prerelease=$prerelease"
            echo "major=$major"
            echo "minor_version=$minor_version"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build release candidates
        env:
          PUBLISH: "true"
          REGISTRY: ghcr.io/${{ github.repository_owner }}
          TAG: candidate-${{ github.run_id }}-${{ github.run_attempt }}
          CACHE_REGISTRY: ghcr.io/${{ github.repository_owner }}
          CACHE_IMAGE: workspace-cache
        run: |
          set -euo pipefail
          docker buildx bake all \
            --set '*.platform=linux/amd64' --set '*.platform+=linux/arm64' \
            --metadata-file "$RUNNER_TEMP/release-candidates.json" \
            --provenance=mode=max --sbom=true --push

      - name: Validate release candidates
        env:
          IMAGE_REGISTRY: workspace-release-test
        run: |
          set -euo pipefail
          # AMD64 is native on ubuntu-latest; ARM64 uses the installed QEMU handler.
          for arch in amd64 arm64; do
            export DOCKER_DEFAULT_PLATFORM="linux/$arch"
            for flavor in code platform full; do
              digest="$(jq -er --arg flavor "$flavor" '.[$flavor]["containerimage.digest"]' "$RUNNER_TEMP/release-candidates.json")"
              docker pull --platform "$DOCKER_DEFAULT_PLATFORM" "$IMAGE@$digest"
              docker tag "$IMAGE@$digest" "$IMAGE_REGISTRY/workspace:$flavor-smoke"
            done

            # full inherits every package in code and platform. Findings remain advisory;
            # database download and scanner errors still fail this step.
            docker run --rm \
              --entrypoint /bin/sh \
              --volume /var/run/docker.sock:/var/run/docker.sock \
              "$IMAGE_REGISTRY/workspace:full-smoke" -c '
                set -eu
                trivy image --download-db-only --no-progress
                trivy image --download-java-db-only --no-progress
                trivy image \
                  --image-src docker --platform "$2" \
                  --skip-db-update --skip-java-db-update \
                  --no-progress --exit-code 0 --ignore-unfixed \
                  --scanners vuln --severity CRITICAL "$1"
              ' sh "$IMAGE_REGISTRY/workspace:full-smoke" "$DOCKER_DEFAULT_PLATFORM"

            ./scripts/smoke-test.sh --no-build all

            # Release validation is sequential; release the loaded platform's disk space.
            for flavor in code platform full; do
              docker image rm --no-prune "$IMAGE_REGISTRY/workspace:$flavor-smoke"
            done
          done

      - name: Promote validated release indexes
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
          MAJOR: ${{ steps.meta.outputs.major }}
          MINOR_VERSION: ${{ steps.meta.outputs.minor_version }}
        run: |
          set -euo pipefail
          for flavor in code platform full; do
            digest="$(jq -er --arg flavor "$flavor" '.[$flavor]["containerimage.digest"]' "$RUNNER_TEMP/release-candidates.json")"
            tags=(--tag "$IMAGE:$flavor-$VERSION")
            if [ "$PRERELEASE" = false ]; then
              tags+=(--tag "$IMAGE:$flavor-$MINOR_VERSION" --tag "$IMAGE:$flavor-$MAJOR" --tag "$IMAGE:$flavor-latest")
              if [ "$flavor" = full ]; then tags+=(--tag "$IMAGE:latest"); fi
            fi
            # Copy the complete index, including both platforms and their attestations.
            docker buildx imagetools create "${tags[@]}" "$IMAGE@$digest"
          done
