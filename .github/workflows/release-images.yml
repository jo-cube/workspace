name: Release Images

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

concurrency:
  # Different release versions update the same moving aliases.
  group: release-images
  queue: max
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/workspace

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      major: ${{ steps.meta.outputs.major }}
      minor_version: ${{ steps.meta.outputs.minor_version }}
    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify tag is on main
        run: |
          set -euo pipefail
          git fetch origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Compute image tags
        id: meta
        run: |
          set -euo pipefail
          ref="${GITHUB_REF_NAME}"
          version="${ref#v}"
          if [ "$version" = "$ref" ]; then
            echo "Tag must start with v: $ref" >&2
            exit 1
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag must look like v1.2.3 or v1.2.3-rc.1: $ref" >&2
            exit 1
          fi

          prerelease=false
          case "$version" in
            *-*) prerelease=true ;;
          esac

          major="${version%%.*}"
          rest="${version#*.}"
          minor="${rest%%.*}"
          minor_version="${major}.${minor}"

          {
            echo "version=$version"
            echo "prerelease=$prerelease"
            echo "major=$major"
            echo "minor_version=$minor_version"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ${{ matrix.runner }}
    # Leave 20 minutes for preparation/promotion; runner queue time is additional.
    timeout-minutes: 160
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      DOCKER_DEFAULT_PLATFORM: linux/${{ matrix.arch }}
      PUBLISH: "true"
      REGISTRY: ghcr.io/${{ github.repository_owner }}
      TAG: candidate-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
      CACHE_REGISTRY: ghcr.io/${{ github.repository_owner }}
      CACHE_IMAGE: workspace-cache-${{ matrix.arch }}
    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build native release candidates
        run: |
          set -euo pipefail
          docker buildx bake all \
            --set "*.platform=$DOCKER_DEFAULT_PLATFORM" \
            --metadata-file "$RUNNER_TEMP/${{ matrix.arch }}.json" \
            --provenance=mode=max --sbom=true --push

      - name: Validate native release candidates
        env:
          IMAGE_REGISTRY: workspace-release-test
        run: |
          set -euo pipefail
          for flavor in code platform full; do
            digest="$(jq -er --arg flavor "$flavor" '.[$flavor]["containerimage.digest"]' "$RUNNER_TEMP/${{ matrix.arch }}.json")"
            docker pull --platform "$DOCKER_DEFAULT_PLATFORM" "$IMAGE@$digest"
            docker tag "$IMAGE@$digest" "$IMAGE_REGISTRY/workspace:$flavor-smoke"
          done

          # Findings remain advisory; scanner and database errors still block promotion.
          docker run --rm \
            --entrypoint /bin/sh \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            "$IMAGE_REGISTRY/workspace:full-smoke" -c '
              set -eu
              trivy image --download-db-only --no-progress
              trivy image --download-java-db-only --no-progress
              trivy image \
                --image-src docker --platform "$2" \
                --skip-db-update --skip-java-db-update \
                --no-progress --exit-code 0 --ignore-unfixed \
                --scanners vuln --severity CRITICAL "$1"
            ' sh "$IMAGE_REGISTRY/workspace:full-smoke" "$DOCKER_DEFAULT_PLATFORM"

          ./scripts/smoke-test.sh --no-build all

      - name: Record validated digests
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/${{ matrix.arch }}.json
          if-no-files-found: error
          overwrite: true

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download validated digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-digests-*
          merge-multiple: true
          path: ${{ runner.temp }}/release-digests

      - name: Assemble and promote validated release indexes
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
          MAJOR: ${{ needs.prepare.outputs.major }}
          MINOR_VERSION: ${{ needs.prepare.outputs.minor_version }}
        run: |
          set -euo pipefail
          for flavor in code platform full; do
            sources=()
            for arch in amd64 arm64; do
              digest="$(jq -er --arg flavor "$flavor" '.[$flavor]["containerimage.digest"]' "$RUNNER_TEMP/release-digests/$arch.json")"
              sources+=("$IMAGE@$digest")
            done
            # Merge complete per-platform indexes, preserving provenance and SBOM manifests.
            docker buildx imagetools create \
              --tag "$IMAGE:$flavor-candidate-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
              --metadata-file "$RUNNER_TEMP/$flavor-index.json" "${sources[@]}"
            digest="$(jq -er '."containerimage.descriptor".digest' "$RUNNER_TEMP/$flavor-index.json")"

            tags=(--tag "$IMAGE:$flavor-$VERSION")
            if [ "$PRERELEASE" = false ]; then
              tags+=(--tag "$IMAGE:$flavor-$MINOR_VERSION" --tag "$IMAGE:$flavor-$MAJOR" --tag "$IMAGE:$flavor-latest")
              if [ "$flavor" = full ]; then tags+=(--tag "$IMAGE:latest"); fi
            fi
            docker buildx imagetools create "${tags[@]}" "$IMAGE@$digest"
          done
