name: Release Images

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

concurrency:
  group: release-images-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/workspace

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag is on main
        run: |
          set -euo pipefail
          git fetch origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Compute image tags
        id: meta
        run: |
          set -euo pipefail
          ref="${GITHUB_REF_NAME}"
          version="${ref#v}"
          if [ "$version" = "$ref" ]; then
            echo "Tag must start with v: $ref" >&2
            exit 1
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag must look like v1.2.3 or v1.2.3-rc.1: $ref" >&2
            exit 1
          fi

          prerelease=false
          case "$version" in
            *-*) prerelease=true ;;
          esac

          major="${version%%.*}"
          rest="${version#*.}"
          minor="${rest%%.*}"
          minor_version="${major}.${minor}"

          {
            echo "version=$version"
            echo "prerelease=$prerelease"
            echo "major=$major"
            echo "minor_version=$minor_version"
          } >> "$GITHUB_OUTPUT"

      - name: Write bake tag override
        run: |
          set -euo pipefail
          version="${{ steps.meta.outputs.version }}"
          prerelease="${{ steps.meta.outputs.prerelease }}"
          major="${{ steps.meta.outputs.major }}"
          minor_version="${{ steps.meta.outputs.minor_version }}"

          tags_for() {
            flavor="$1"
            printf '"%s:%s-%s"' "$IMAGE" "$flavor" "$version"
            if [ "$prerelease" = "false" ]; then
              printf ', "%s:%s-%s", "%s:%s-%s", "%s:%s-latest"' \
                "$IMAGE" "$flavor" "$minor_version" \
                "$IMAGE" "$flavor" "$major" \
                "$IMAGE" "$flavor"
            fi
          }

          {
            echo 'target "code" {'
            echo "  tags = [$(tags_for code)]"
            echo "  platforms = [\"linux/amd64\", \"linux/arm64\"]"
            echo "}"
            echo 'target "platform" {'
            echo "  tags = [$(tags_for platform)]"
            echo "  platforms = [\"linux/amd64\", \"linux/arm64\"]"
            echo "}"
            echo 'target "full" {'
            if [ "$prerelease" = "false" ]; then
              echo "  tags = [$(tags_for full), \"$IMAGE:latest\"]"
            else
              echo "  tags = [$(tags_for full)]"
            fi
            echo "  platforms = [\"linux/amd64\", \"linux/arm64\"]"
            echo "}"
          } > /tmp/release-tags.hcl

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish code, platform, and full
        env:
          CI: "true"
          REGISTRY: ghcr.io/${{ github.repository_owner }}
          CACHE_REGISTRY: ghcr.io/${{ github.repository_owner }}
          CACHE_IMAGE: workspace-cache
        run: docker buildx bake -f docker-bake.hcl -f /tmp/release-tags.hcl code platform full --push
