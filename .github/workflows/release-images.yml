name: Release Images

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

concurrency:
  group: release-images-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/workspace

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout tag
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Verify tag is on main
        run: |
          set -euo pipefail
          git fetch origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Compute image tags
        id: meta
        run: |
          set -euo pipefail
          ref="${GITHUB_REF_NAME}"
          version="${ref#v}"
          if [ "$version" = "$ref" ]; then
            echo "Tag must start with v: $ref" >&2
            exit 1
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag must look like v1.2.3 or v1.2.3-rc.1: $ref" >&2
            exit 1
          fi

          prerelease=false
          case "$version" in
            *-*) prerelease=true ;;
          esac

          major="${version%%.*}"
          rest="${version#*.}"
          minor="${rest%%.*}"
          minor_version="${major}.${minor}"

          {
            echo "version=$version"
            echo "prerelease=$prerelease"
            echo "major=$major"
            echo "minor_version=$minor_version"
          } >> "$GITHUB_OUTPUT"

      - name: Write bake tag override
        run: |
          set -euo pipefail
          version="${{ steps.meta.outputs.version }}"
          prerelease="${{ steps.meta.outputs.prerelease }}"
          major="${{ steps.meta.outputs.major }}"
          minor_version="${{ steps.meta.outputs.minor_version }}"

          tags_for() {
            flavor="$1"
            printf '"%s:%s-%s"' "$IMAGE" "$flavor" "$version"
            if [ "$prerelease" = "false" ]; then
              printf ', "%s:%s-%s", "%s:%s-%s", "%s:%s-latest"' \
                "$IMAGE" "$flavor" "$minor_version" \
                "$IMAGE" "$flavor" "$major" \
                "$IMAGE" "$flavor"
            fi
          }

          {
            echo 'target "code" {'
            echo "  tags = [$(tags_for code)]"
            echo "  platforms = [\"linux/amd64\", \"linux/arm64\"]"
            echo "}"
            echo 'target "platform" {'
            echo "  tags = [$(tags_for platform)]"
            echo "  platforms = [\"linux/amd64\", \"linux/arm64\"]"
            echo "}"
            echo 'target "full" {'
            if [ "$prerelease" = "false" ]; then
              echo "  tags = [$(tags_for full), \"$IMAGE:latest\"]"
            else
              echo "  tags = [$(tags_for full)]"
            fi
            echo "  platforms = [\"linux/amd64\", \"linux/arm64\"]"
            echo "}"
          } > /tmp/release-tags.hcl

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Smoke-test release images
        env:
          CACHE_FROM: "true"
          CACHE_REGISTRY: ghcr.io/${{ github.repository_owner }}
          CACHE_IMAGE: workspace-cache
        run: ./scripts/smoke-test.sh code platform full

      - name: Scan release images
        run: |
          docker run --rm \
            --entrypoint /bin/sh \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            workspace-test/workspace:full -c '
              set -eu
              trivy image --download-db-only --no-progress
              trivy image --download-java-db-only --no-progress
              for flavor in code platform full; do
                trivy image \
                  --skip-db-update \
                  --skip-java-db-update \
                  --parallel 1 \
                  --no-progress \
                  --exit-code 1 \
                  --ignore-unfixed \
                  --scanners vuln \
                  --severity CRITICAL \
                  "workspace-test/workspace:$flavor"
              done
            '

      - name: Publish code, platform, and full
        env:
          PUBLISH: "true"
          REGISTRY: ghcr.io/${{ github.repository_owner }}
          CACHE_REGISTRY: ghcr.io/${{ github.repository_owner }}
          CACHE_IMAGE: workspace-cache
        run: docker buildx bake -f docker-bake.hcl -f /tmp/release-tags.hcl code platform full --provenance=mode=max --sbom=true --push
