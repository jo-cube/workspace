name: Patch Images

on:
  push:
    branches:
      - 'patch/**'

permissions:
  contents: read
  packages: write

concurrency:
  group: patch-images-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/workspace

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compute patch tag
        id: meta
        run: |
          set -euo pipefail
          branch="${GITHUB_REF_NAME#patch/}"
          slug="$(printf '%s' "$branch" \
            | tr '[:upper:]' '[:lower:]' \
            | sed -E 's/[^a-z0-9._-]+/-/g; s/^-+//; s/-+$//')"
          if [ -z "$slug" ]; then
            slug="patch"
          fi
          short_sha="$(git rev-parse --short=12 HEAD)"
          {
            echo "slug=$slug"
            echo "short_sha=$short_sha"
          } >> "$GITHUB_OUTPUT"

      - name: Write bake tag override
        run: |
          set -euo pipefail
          slug="${{ steps.meta.outputs.slug }}"
          short_sha="${{ steps.meta.outputs.short_sha }}"

          tags_for() {
            flavor="$1"
            printf '"%s:%s-patch-%s", "%s:%s-patch-%s-%s"' \
              "$IMAGE" "$flavor" "$slug" \
              "$IMAGE" "$flavor" "$slug" "$short_sha"
          }

          {
            echo 'target "code" {'
            echo "  tags = [$(tags_for code)]"
            echo "  platforms = [\"linux/amd64\", \"linux/arm64\"]"
            echo "}"
            echo 'target "platform" {'
            echo "  tags = [$(tags_for platform)]"
            echo "  platforms = [\"linux/amd64\", \"linux/arm64\"]"
            echo "}"
            echo 'target "full" {'
            echo "  tags = [$(tags_for full)]"
            echo "  platforms = [\"linux/amd64\", \"linux/arm64\"]"
            echo "}"
          } > /tmp/patch-tags.hcl

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish patch images
        env:
          PUBLISH: "true"
          REGISTRY: ghcr.io/${{ github.repository_owner }}
          CACHE_REGISTRY: ghcr.io/${{ github.repository_owner }}
          CACHE_IMAGE: workspace-cache
        run: docker buildx bake -f docker-bake.hcl -f /tmp/patch-tags.hcl code platform full --provenance=mode=max --sbom=true --push
