name: CI

on:
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
  push:
    branches:
      - main
      - dev
      - 'patch/**'
    paths-ignore:
      - '**.md'
      - 'docs/**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check shell scripts
        run: |
          for script in scripts/doctor.sh scripts/smoke-test.sh; do
            bash -n "$script"
          done
          for script in scripts/healthcheck.sh config/cont-init.d/* config/s6/*/run; do
            sh -n "$script"
          done

      - name: Check just recipes
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: List just recipes
        run: |
          just --fmt --check
          just --list
          (cd templates/enterprise && just --fmt --check && just --list)

      - name: Check Compose configuration
        run: |
          docker compose config --quiet
          docker compose --project-directory templates/enterprise config --quiet

      - name: Print bake graph
        run: docker buildx bake --print all

      - name: Print enterprise bake graph
        working-directory: templates/enterprise
        run: docker buildx bake --print

  smoke:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/heads/patch/')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: read
    env:
      CACHE_FROM: "true"
      CACHE_REGISTRY: ghcr.io/${{ github.repository_owner }}
      CACHE_IMAGE: workspace-cache
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Smoke-test code image
        if: github.event_name == 'push' && (github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/heads/patch/'))
        run: ./scripts/smoke-test.sh code

      - name: Smoke-test all supported images
        if: github.event_name == 'pull_request'
        run: ./scripts/smoke-test.sh all
