name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - dev
      - 'patch/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: services/status/go.mod
          cache: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Check shell scripts
        run: |
          bash -n scripts/doctor.sh scripts/smoke-test.sh
          sh -n config/cont-init.d/00-fix-perms config/s6/*/run

      - name: Check status service
        working-directory: services/status
        run: go test ./...

      - name: Check just recipes
        uses: extractions/setup-just@dd310ad5a97d8e7b41793f8ef055398d51ad4de6 # v2

      - name: List just recipes
        run: |
          just --fmt --check
          just --list
          (cd templates/enterprise && just --fmt --check && just --list)

      - name: Check Compose configuration
        run: |
          docker compose config --quiet
          docker compose --project-directory templates/enterprise config --quiet

      - name: Print bake graph
        run: docker buildx bake --print all

      - name: Print enterprise bake graph
        working-directory: templates/enterprise
        run: docker buildx bake --print

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Smoke-test code image
        run: ./scripts/smoke-test.sh code
