name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - dev
      - 'patch/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Check shell scripts
        run: bash -n scripts/doctor.sh scripts/smoke-test.sh

      - name: Check status service
        working-directory: services/status
        run: go test ./...

      - name: Check just recipes
        uses: extractions/setup-just@v2

      - name: List just recipes
        run: just --list

      - name: Print bake graph
        run: docker buildx bake --print all

      - name: Print enterprise bake graph
        working-directory: templates/enterprise
        run: docker buildx bake --print
